#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# yuPad43 (IQS9151) input forwarded to the right central
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_IQS9151=y
CONFIG_INPUT_IQS9151_RESOLUTION_X=1300
CONFIG_INPUT_IQS9151_RESOLUTION_Y=1192
# Keep cursor glide (the new driver turns it off by default)
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_ENABLE=y
# Left pad is mounted rotated the other way: fix direction
CONFIG_INPUT_IQS9151_ROTATE_270=y
# Calm scrolling: no inertia, no pinch-zoom, larger start threshold
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_2F_PINCH_ENABLE=n
CONFIG_INPUT_IQS9151_2F_SCROLL_START_MOVE=80
# Allow small finger wobble in a 2-finger tap (right click)
CONFIG_INPUT_IQS9151_2F_TAP_MOVE=100

#Bluetooth config -------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
