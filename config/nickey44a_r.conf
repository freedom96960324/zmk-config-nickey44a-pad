# Keyboard name reported to Studio
CONFIG_ZMK_KEYBOARD_NAME="Nickey44A-PAD"

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000

# yuPad43 (IQS9151) pointing device
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_IQS9151=y
CONFIG_INPUT_IQS9151_RESOLUTION_X=1300
CONFIG_INPUT_IQS9151_RESOLUTION_Y=1192
# Pad orientation: change to _90 / _180 / _270 if the cursor moves the wrong way
CONFIG_INPUT_IQS9151_ROTATE_0=y
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_ENABLE=n
# Pinch would only produce extra scrolling here
CONFIG_INPUT_IQS9151_2F_PINCH_ENABLE=n
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Larger input queue so trackpad events forwarded from the left half are not dropped
CONFIG_INPUT_QUEUE_MAX_MSGS=128
