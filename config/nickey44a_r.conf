# Keyboard name reported to Studio
CONFIG_ZMK_KEYBOARD_NAME="Nickey44A-PAD"

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# yuPad43 (IQS9151) pointing device
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
# Smooth (high-resolution) scrolling, same as LalaPadGen2
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_INPUT_IQS9151=y
CONFIG_INPUT_IQS9151_RESOLUTION_X=1300
CONFIG_INPUT_IQS9151_RESOLUTION_Y=1192
# Right pad: vertical scroll only (left pad does horizontal),
# and a 2-finger tap must not turn into a scroll.
CONFIG_INPUT_IQS9151_SCROLL_X_ENABLE=n
CONFIG_INPUT_IQS9151_2F_SCROLL_START_MOVE=80
# Allow small finger wobble in a 2-finger tap (right click)
CONFIG_INPUT_IQS9151_2F_TAP_MOVE=100
# Turn off scroll inertia (same as the left pad)
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=n
# Turn off pinch (it only produced a fast scroll; same as the left pad)
CONFIG_INPUT_IQS9151_2F_PINCH_ENABLE=n
# Right pad is mounted rotated: fix direction (try 270 if still wrong)
CONFIG_INPUT_IQS9151_ROTATE_90=y

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
