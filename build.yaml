---
include:
  - board: seeeduino_xiao_ble
    shield: nickey44a_r rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: nickey44a_r
  # TEST ONLY: right half with a USB log (view in Chrome serial terminal)
  - board: seeeduino_xiao_ble
    shield: nickey44a_r rgbled_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_INPUT_IQS9151_LOG_LEVEL=3
    artifact-name: nickey44a_r_log
  - board: seeeduino_xiao_ble
    shield: nickey44a_l rgbled_adapter
    artifact-name: nickey44a_l
  # TEST ONLY: left half with the trackpad turned off
  - board: seeeduino_xiao_ble
    shield: nickey44a_l rgbled_adapter nickey44a_nopad
    artifact-name: nickey44a_l_nopad
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset
